name: arena-dolphinscheduler

x-arena-env: &arena-env
  - ./.env
  - ./.env.prod

x-arena-shared: &arena-shared
  type: bind
  source: ${ARENA_SHARED_DIR:?ARENA_SHARED_DIR is required}
  target: /shared

services:
  dolphinscheduler-schema-initializer:
    image: apache/dolphinscheduler-tools:3.2.2
    restart: "no"
    env_file: *arena-env
    environment:
      DATABASE: postgresql
    command: ["tools/bin/upgrade-schema.sh"]

  dolphinscheduler-standalone:
    image: arena/dolphinscheduler-standalone:3.2.2-runtime-0.1.0
    build:
      context: .
      dockerfile: Dockerfile.standalone
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DATABASE: postgresql
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JACKSON_TIME_ZONE: UTC
      API_PYTHON_GATEWAY_ENABLED: "true"
      MASTER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_TENANT_CONFIG_DEFAULT_TENANT_ENABLED: "true"
    env_file: *arena-env
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:25333:25333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:12345/dolphinscheduler/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      dolphinscheduler-schema-initializer:
        condition: service_completed_successfully
    volumes:
      - *arena-shared
      - D:/Docker/dolphinscheduler/resources:/tmp/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs

  backend:
    image: arena/backend:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      PYTHONPATH: /workspace/backend
    env_file: *arena-env
    ports:
      - "127.0.0.1:8000:8000"
    working_dir: /workspace/backend
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/backend",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      dolphinscheduler-standalone:
        condition: service_healthy
    volumes:
      - *arena-shared
      - ./backend/core:/workspace/backend/core
      - ./backend/config.py:/workspace/backend/config.py
      - ./backend/alembic:/workspace/backend/alembic
      - ./backend/main.py:/workspace/backend/main.py
      - ./backend/alembic.ini:/workspace/backend/alembic.ini

volumes:
  dolphinscheduler-logs:
