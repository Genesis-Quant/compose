name: arena-dolphinscheduler

x-arena-env: &arena-env
  - ./.env
  - ./.env.prod

x-dolphinscheduler-environment: &dolphinscheduler-environment
  DATABASE: postgresql
  SPRING_PROFILES_ACTIVE: postgresql
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_DATASOURCE_URL: jdbc:postgresql://${PGSQL_HOST:?PGSQL_HOST is required}:${PGSQL_PORT:?PGSQL_PORT is required}/${DOLPHINSCHEDULER_DATABASE:?DOLPHINSCHEDULER_DATABASE is required}
  SPRING_DATASOURCE_USERNAME: ${PGSQL_USER:?PGSQL_USER is required}
  SPRING_DATASOURCE_PASSWORD: ${PGSQL_PASSWORD:?PGSQL_PASSWORD is required}

services:
  dolphinscheduler-schema-initializer:
    image: apache/dolphinscheduler-tools:3.2.2
    restart: "no"
    env_file: *arena-env
    environment: *dolphinscheduler-environment
    command: ["tools/bin/upgrade-schema.sh"]

  dolphinscheduler-standalone:
    image: arena/dolphinscheduler-standalone:3.2.2-runtime-0.1.0
    build:
      context: .
      dockerfile: Dockerfile.standalone
    restart: unless-stopped
    environment:
      <<: *dolphinscheduler-environment
      TZ: Asia/Shanghai
      SPRING_JACKSON_TIME_ZONE: UTC
      API_PYTHON_GATEWAY_ENABLED: "true"
      API_PYTHON_GATEWAY_AUTH_TOKEN: ${DOLPHINSCHEDULER_PYTHON_GATEWAY_TOKEN:?DOLPHINSCHEDULER_PYTHON_GATEWAY_TOKEN is required}
      MASTER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_TENANT_CONFIG_DEFAULT_TENANT_ENABLED: "true"
    env_file: *arena-env
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:25333:25333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:12345/dolphinscheduler/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      dolphinscheduler-schema-initializer:
        condition: service_completed_successfully
    volumes:
      - arena-shared:/shared
      - dolphinscheduler-resources:/tmp/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs

  backend:
    image: arena/backend:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      PYTHONPATH: /workspace/backend
    env_file: *arena-env
    ports:
      - "127.0.0.1:8000:8000"
    working_dir: /workspace/backend
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/backend",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      dolphinscheduler-standalone:
        condition: service_healthy
    volumes:
      - arena-shared:/shared
      - ./backend:/workspace/backend

volumes:
  arena-shared:
  dolphinscheduler-logs:
  dolphinscheduler-resources:

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-arena-network}
    external: true
