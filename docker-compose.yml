name: arena-dolphinscheduler

x-arena-shared: &arena-shared
  type: bind
  source: ${ARENA_SHARED_HOST_DIR:-D:/Docker/arena/shared}
  target: /shared

services:
  dolphinscheduler-schema-initializer:
    image: apache/dolphinscheduler-tools:3.2.2
    restart: "no"
    environment:
      DATABASE: postgresql
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST is required}:${POSTGRES_PORT:-5432}/${DOLPHINSCHEDULER_POSTGRES_DB:-dolphinscheduler}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    command: ["tools/bin/upgrade-schema.sh"]

  dolphinscheduler-standalone:
    image: arena/dolphinscheduler-standalone:3.2.2-runtime-0.1.0
    build:
      context: .
      dockerfile: Dockerfile.standalone
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DATABASE: postgresql
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST is required}:${POSTGRES_PORT:-5432}/${DOLPHINSCHEDULER_POSTGRES_DB:-dolphinscheduler}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER is required}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      SPRING_JACKSON_TIME_ZONE: UTC
      API_PYTHON_GATEWAY_ENABLED: "true"
      API_PYTHON_GATEWAY_AUTH_TOKEN: "${DOLPHINSCHEDULER_PYTHON_GATEWAY_AUTH_TOKEN:?DOLPHINSCHEDULER_PYTHON_GATEWAY_AUTH_TOKEN is required}"
      MASTER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_TENANT_CONFIG_DEFAULT_TENANT_ENABLED: "true"
    env_file:
      - ./.env
      - ./.env.prod
    ports:
      - "127.0.0.1:12345:12345"
      - "127.0.0.1:25333:25333"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:12345/dolphinscheduler/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      dolphinscheduler-schema-initializer:
        condition: service_completed_successfully
    volumes:
      - *arena-shared
      - D:/Docker/dolphinscheduler/resources:/tmp/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs

  backend:
    image: arena/backend:0.1.0
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      ARENA_SHARED_DIR: /shared
      PYTHONPATH: /workspace/backend
      DATABASE_URL: "postgresql://${POSTGRES_HOST:?POSTGRES_HOST is required}:${POSTGRES_PORT:-5432}/${DOLPHINSCHEDULER_POSTGRES_DB:-dolphinscheduler}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      ARENA_JWT_SECRET: "${ARENA_JWT_SECRET:?ARENA_JWT_SECRET is required}"
      ARENA_JWT_EXPIRE_DAYS: "${ARENA_JWT_EXPIRE_DAYS:-30}"
      DOLPHINSCHEDULER_BASE_URL: http://dolphinscheduler-standalone:12345/dolphinscheduler
      DOLPHINSCHEDULER_PYTHON_GATEWAY_ADDRESS: dolphinscheduler-standalone
      DOLPHINSCHEDULER_PYTHON_GATEWAY_PORT: "25333"
      DOLPHINSCHEDULER_PYTHON_GATEWAY_AUTH_TOKEN: "${DOLPHINSCHEDULER_PYTHON_GATEWAY_AUTH_TOKEN:?DOLPHINSCHEDULER_PYTHON_GATEWAY_AUTH_TOKEN is required}"
    env_file:
      - ./.env
      - ./.env.prod
    ports:
      - "127.0.0.1:8000:8000"
    working_dir: /workspace/backend
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/backend",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      dolphinscheduler-standalone:
        condition: service_healthy
    volumes:
      - *arena-shared
      - ./backend/apps:/workspace/backend/apps
      - ./backend/config:/workspace/backend/config
      - ./backend/alembic:/workspace/backend/alembic
      - ./backend/main.py:/workspace/backend/main.py
      - ./backend/alembic.ini:/workspace/backend/alembic.ini

volumes:
  dolphinscheduler-logs:
